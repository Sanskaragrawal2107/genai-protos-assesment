[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "http://15.206.160.2/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "http://15.206.160.2/health"
  status = 200
  force = true
